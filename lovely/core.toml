[manifest]
version = "1.0.0"
dump_lua = true
priority = 99999999

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''_pool[#_pool + 1] = v.key
                _pool_size = _pool_size + 1
            else
                _pool[#_pool + 1] = 'UNAVAILABLE'
            end
            end'''
position = "after"
payload = '''
if G.GAME.starting_params.showmandeck then
    if pseudorandom('showmandeck', 1, 6) == 1 then
        new_pool = {}

        if _pool and G.jokers and G.jokers.cards then
            for r = 1, #_pool do
                for q = 1, #G.jokers.cards do
                    if _pool[r] == G.jokers.cards[q].config.center.key then
                        new_pool[#new_pool + 1] = G.jokers.cards[q].config.center.key
                    end
                end
                for q = 1, #G.consumeables do
                    if _pool[r] == G.consumeables[q].config.center.key then
                        new_pool[#new_pool + 1] = G.consumeables[q].config.center.key
                    end
                end
            end
        end

        if #new_pool > 0 then
            _pool = new_pool
            _pool_size = #new_pool
        end
    end
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = '''calculate_reroll_cost(final_free)'''
position = "after"
payload = '''
if G.GAME.starting_params.snakeskinsleeve then
    play_sound('coin2')
    play_sound('other1')
    local new_shop_card = create_card_for_shop(G.shop_jokers)
    G.shop_jokers:emplace(new_shop_card)
    new_shop_card:juice_up()
    G.shop_jokers.T.w = math.min(#G.shop_jokers.cards*1.02*G.CARD_W,4.08*G.CARD_W)
    G.shop:recalculate()
    return true
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''elseif self.ability.name:find('Standard') then'''
position = "at"
payload = '''
elseif self.ability.name:find('Standard') and G.GAME.starting_params.first_card_in_pack then --smods doesn't seem to get here anyway, this toml patch might be useless
    card = create_card((pseudorandom(pseudoseed('stdset'..G.GAME.round_resets.ante)) > 0.6) and "Enhanced" or "Base", G.pack_cards, nil, nil, nil, true, nil, 'sta')
elseif self.ability.name:find('Standard') then
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''if keep then card_protos[#card_protos+1] = {s=_s,r=_r,e=_e,d=_d,g=_g} end'''
position = "before"
payload = '''
if G.GAME.starting_params.sedmadeck then
    local removies = {'2', '3', '4', '5', '6'}
    for kk, vv in pairs(removies) do
        if vv == v.value then
            keep = false
            break
        end
    end
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''for _, area in ipairs(SMODS.get_card_areas('jokers')) do
            for _, _card in ipairs(area.cards) do
            local ret = _card:calculate_dollar_bonus()
    
            -- TARGET: calc_dollar_bonus per card'''
position = "before"
payload = '''
if G.GAME.starting_params.cloud9deck and G.GAME.starting_params.hand_delta ~= 0 then
    add_round_eval_row({dollars = G.GAME.starting_params.hand_delta, bonus = true, name='custom', number = G.GAME.starting_params.hand_delta, text = "Cloud 9 Deck", pitch = pitch})
    pitch = pitch + 0.06
    dollars = dollars + G.GAME.starting_params.hand_delta
end
if G.GAME.starting_params.acrobatdeck and G.GAME.acrobat_deck_bonus ~= 0 then
    add_round_eval_row({dollars = G.GAME.acrobat_deck_bonus, bonus = true, name='custom', number = G.GAME.acrobat_deck_bonus, text = "Acrobat Deck", pitch = pitch})
    pitch = pitch + 0.06
    dollars = dollars + G.GAME.acrobat_deck_bonus
end
if G.GAME.starting_params.vagabondsleeve then
    local dolla = G.GAME.levels_lost_this_round * 3
    if G.GAME.dollars < 0 and not G.GAME.modifiers.no_interest then
        dolla = dolla + G.GAME.interest_amount*(G.GAME.interest_cap/5)
    end
    if dolla > 0 then
        add_round_eval_row({dollars = dolla, bonus = true, name='custom', number = G.GAME.starting_params.hand_delta, text = "Vagabond Deck", pitch = pitch})
        pitch = pitch + 0.06
        dollars = dollars + dolla
    end
    G.GAME.levels_lost_this_round = 0
end
'''
match_indent = true